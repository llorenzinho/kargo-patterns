# Source: kargo-pattern/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kargo-pattern
  labels:
    helm.sh/chart: kargo-pattern-0.2.0
    app.kubernetes.io/name: kargo-pattern
    app.kubernetes.io/instance: kargo-pattern
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kargo-pattern
      app.kubernetes.io/instance: kargo-pattern
  template:
    metadata:
      labels:
        helm.sh/chart: kargo-pattern-0.2.0
        app.kubernetes.io/name: kargo-pattern
        app.kubernetes.io/instance: kargo-pattern
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: kargo-pattern
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "ghcr.io/llorenzinho/kargo-patterns:v0.2.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: PORT
              value: "8080"
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true