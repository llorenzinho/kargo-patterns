name: chart-publish

on:
  workflow_call:
    inputs:
      version:
        description: Chart version without the v prefix, for example 0.2.0
        required: true
        type: string
      tag:
        description: GitHub release tag, for example chart-v0.2.0
        required: true
        type: string
      sha:
        description: Commit SHA to build
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Chart version without the v prefix, for example 0.2.0
        required: true
        type: string
      tag:
        description: GitHub release tag, for example chart-v0.2.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: chart-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      CHART_NAMESPACE: ${{ github.repository_owner }}/charts
      RELEASE_TAG: ${{ inputs.tag }}
      CHART_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Package chart
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package chart --destination dist

      - name: Verify chart version
        run: |
          set -euo pipefail
          actual="$(helm show chart chart | awk '/^version:/ {print $2}')"
          test "${actual}" = "${CHART_VERSION}"

      - name: Login to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        run: |
          set -euo pipefail
          helm push dist/*.tgz "oci://${REGISTRY}/${CHART_NAMESPACE}"

      - name: Attach chart to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*.tgz --clobber
