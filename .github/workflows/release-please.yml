name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      app-released: ${{ steps.release.outputs['app--release_created'] }}
      app-tag: ${{ steps.release.outputs['app--tag_name'] }}
      app-sha: ${{ steps.release.outputs['app--sha'] }}
      chart-released: ${{ steps.release.outputs['chart--release_created'] }}
      chart-tag: ${{ steps.release.outputs['chart--tag_name'] }}
      chart-version: ${{ steps.release.outputs['chart--version'] }}
      chart-sha: ${{ steps.release.outputs['chart--sha'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Publish app image
    needs: release-please
    if: needs.release-please.outputs.app-released == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release-please.outputs.app-tag }}
      sha: ${{ needs.release-please.outputs.app-sha }}
      push: true

  chart:
    name: Publish Helm chart
    needs: release-please
    if: needs.release-please.outputs.chart-released == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/chart-publish.yml
    with:
      version: ${{ needs.release-please.outputs.chart-version }}
      tag: ${{ needs.release-please.outputs.chart-tag }}
      sha: ${{ needs.release-please.outputs.chart-sha }}
