version: "3"

dotenv: [.env]

vars:
  APP_DIR: app
  CHART_DIR: chart
  GITOPS_CONFIGS_DIR: gitops/configs
  GITOPS_KARGO_DIR: gitops/kargo
  GIT_REPO_URL: https://github.com/llorenzinho/kargo-patterns.git
  KARGO_NAMESPACE: kargo
  KARGO_PROJECT: release-train
  IMAGE_REPO: ghcr.io/llorenzinho/kargo-patterns
  IMAGE_TAG: dev
  CLUSTER_NAME: kargo-pattern
  K8S_NAMESPACE: kargo-pattern
  RELEASE_NAME: kargo-pattern
  INGRESS_HOST: kargo-pattern.localhost
  LOCAL_HTTP_PORT: "8080"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Install mise tools, create .env and install git hooks
    cmds:
      - mise trust
      - mise install
      - cmd: test -f .env || cp .env.example .env
        silent: true
      - pre-commit install --install-hooks -t pre-commit -t commit-msg

  doctor:
    desc: Check the local prerequisites
    cmds:
      - mise --version
      - go version
      - kind version
      - kubectl version --client
      - helm version
      - task --version
      - docker info >/dev/null
      - echo "Docker daemon OK"

  app:fmt:
    desc: Format the Go code
    dir: "{{.APP_DIR}}"
    cmds:
      - gofmt -w .

  app:fmt:check:
    desc: Check Go formatting
    dir: "{{.APP_DIR}}"
    cmds:
      - test -z "$(gofmt -l .)"

  app:vet:
    desc: Run go vet
    dir: "{{.APP_DIR}}"
    cmds:
      - go vet ./...

  app:lint:
    desc: Run golangci-lint
    dir: "{{.APP_DIR}}"
    cmds:
      # Always use the mise-pinned v2 binary: a global v1 in PATH rejects the
      # v2 config in .golangci.yml.
      - mise exec -- golangci-lint run ./...

  app:test:
    desc: Run the unit tests
    dir: "{{.APP_DIR}}"
    cmds:
      - go test -race ./...

  app:build:
    desc: Build the Go packages
    dir: "{{.APP_DIR}}"
    cmds:
      - go build ./...

  app:run:
    desc: Run the HTTP server locally
    dir: "{{.APP_DIR}}"
    cmds:
      - go run ./cmd/server

  app:tidy:
    desc: Tidy the Go module
    dir: "{{.APP_DIR}}"
    cmds:
      - go mod tidy

  app:check:
    desc: Format, vet, lint, test and build the app
    cmds:
      - task: app:fmt:check
      - task: app:vet
      - task: app:lint
      - task: app:test
      - task: app:build

  chart:lint:
    desc: Lint the Helm chart
    cmds:
      - helm lint {{.CHART_DIR}}

  chart:template:
    desc: Render the Helm chart
    cmds:
      - helm template {{.RELEASE_NAME}} {{.CHART_DIR}} --namespace {{.K8S_NAMESPACE}} --set image.tag=test

  chart:package:
    desc: Package the Helm chart
    cmds:
      - helm package {{.CHART_DIR}} --destination dist

  chart:install:
    desc: Install or upgrade the chart on the current cluster
    cmds:
      - >-
        helm upgrade --install {{.RELEASE_NAME}} {{.CHART_DIR}}
        --namespace {{.K8S_NAMESPACE}}
        --create-namespace
        --set image.repository={{.IMAGE_REPO}}
        --set image.tag={{.IMAGE_TAG}}
        --set-json 'ingress.hosts=[{"host":"{{.INGRESS_HOST}}","paths":[{"path":"/","pathType":"Prefix"}]}]'
        --wait
        --timeout 3m

  chart:uninstall:
    desc: Remove the chart from the current cluster
    cmds:
      - helm uninstall {{.RELEASE_NAME}} --namespace {{.K8S_NAMESPACE}} --ignore-not-found

  cluster:create:
    desc: Create the local kind cluster
    cmds:
      - kind get clusters | grep -qx "{{.CLUSTER_NAME}}" || kind create cluster --name {{.CLUSTER_NAME}} --config hack/kind-config.yaml
      - task: cluster:tune

  cluster:tune:
    desc: Raise inotify limits so kube-proxy can start on low-limit hosts
    cmds:
      # These /proc/sys values are host-wide, not namespaced. The default
      # fs.inotify.max_user_instances=128 makes kube-proxy crash with
      # "fsnotify watcher init: too many open files" in kind nodes.
      - >-
        docker exec --privileged {{.CLUSTER_NAME}}-control-plane
        sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288 >/dev/null

  cluster:delete:
    desc: Delete the local kind cluster
    cmds:
      - kind delete cluster --name {{.CLUSTER_NAME}}

  ingress:install:
    desc: Install ingress-nginx in the kind cluster
    cmds:
      - >-
        helm upgrade --install ingress-nginx ingress-nginx
        --repo https://kubernetes.github.io/ingress-nginx
        --namespace ingress-nginx
        --create-namespace
        --set controller.service.type=NodePort
        --set controller.service.nodePorts.http=30080
        --set controller.service.nodePorts.https=30443
        --set controller.hostPort.enabled=true
        --wait
        --timeout 5m

  argocd:install:
    desc: Install or upgrade ArgoCD on the current cluster
    cmds:
      # Server-side apply: the ApplicationSet CRD exceeds the client-side limit.
      - kubectl apply --server-side --force-conflicts -k {{.GITOPS_CONFIGS_DIR}}/argocd
      - kubectl rollout status deployment/argocd-server --namespace argocd --timeout 5m
      - kubectl rollout status deployment/argocd-repo-server --namespace argocd --timeout 5m
      - kubectl rollout status deployment/argocd-applicationset-controller --namespace argocd --timeout 5m
      - kubectl rollout status statefulset/argocd-application-controller --namespace argocd --timeout 5m

  argocd:bootstrap:
    desc: Apply the root Application (reads gitops/configs/apps from origin/main)
    cmds:
      - kubectl apply -f {{.GITOPS_CONFIGS_DIR}}/bootstrap/root.yaml

  argocd:password:
    desc: Print the initial ArgoCD admin password
    silent: true
    cmds:
      - kubectl get secret argocd-initial-admin-secret --namespace argocd --output jsonpath='{.data.password}' | base64 --decode

  kargo:admin:
    desc: Create the Kargo admin credentials once, outside Git
    silent: true
    cmds:
      - kubectl create namespace {{.KARGO_NAMESPACE}} --dry-run=client --output yaml | kubectl apply --filename - >/dev/null
      - |
        set -eu
        if kubectl get secret kargo-admin-credentials --namespace {{.KARGO_NAMESPACE}} >/dev/null 2>&1; then
          exit 0
        fi
        password="$(openssl rand -base64 48 | tr -d '=+/' | head -c 24)"
        signing_key="$(openssl rand -base64 48 | tr -d '=+/' | head -c 32)"
        password_hash="$(printf '%s' "$password" | mise exec -- kargo hash-password --password-stdin)"
        kubectl create secret generic kargo-api-admin --namespace {{.KARGO_NAMESPACE}} \
          --from-literal=ADMIN_ACCOUNT_PASSWORD_HASH="$password_hash" \
          --from-literal=ADMIN_ACCOUNT_TOKEN_SIGNING_KEY="$signing_key" \
          --dry-run=client --output yaml | kubectl apply --filename - >/dev/null
        # Written last: its presence marks the admin credentials as complete.
        kubectl create secret generic kargo-admin-credentials --namespace {{.KARGO_NAMESPACE}} \
          --from-literal=password="$password" \
          --dry-run=client --output yaml | kubectl apply --filename - >/dev/null

  kargo:password:
    desc: Print the Kargo admin password
    silent: true
    cmds:
      - kubectl get secret kargo-admin-credentials --namespace {{.KARGO_NAMESPACE}} --output jsonpath='{.data.password}' | base64 --decode

  kargo:git-credentials:
    desc: Give Kargo the token it uses to push the deploy/app/* branches
    silent: true
    preconditions:
      - sh: test -n "${KARGO_GIT_USERNAME:-}" && test -n "${KARGO_GIT_TOKEN:-}"
        msg: Set KARGO_GIT_USERNAME and KARGO_GIT_TOKEN in .env (see .env.example)
    cmds:
      - |
        set -eu
        # The label lets the Kargo Project adopt this namespace later.
        kubectl create namespace {{.KARGO_PROJECT}} --dry-run=client --output yaml \
          | kubectl label --local --filename - kargo.akuity.io/project=true --output yaml \
          | kubectl apply --filename - >/dev/null
        kubectl create secret generic git-credentials --namespace {{.KARGO_PROJECT}} \
          --from-literal=repoURL={{.GIT_REPO_URL}} \
          --from-literal=username="$KARGO_GIT_USERNAME" \
          --from-literal=password="$KARGO_GIT_TOKEN" \
          --dry-run=client --output yaml \
          | kubectl label --local --filename - kargo.akuity.io/cred-type=git --output yaml \
          | kubectl apply --filename - >/dev/null

  kargo:wait:
    desc: Wait for the ArgoCD-managed Kargo installation
    cmds:
      - timeout 300 sh -c 'until kubectl get application kargo --namespace argocd >/dev/null 2>&1; do sleep 5; done'
      - kubectl wait application/kargo --namespace argocd --for=jsonpath='{.status.health.status}'=Healthy --timeout 15m
      - kubectl rollout status deployment/kargo-api --namespace {{.KARGO_NAMESPACE}} --timeout 5m

  gitops:validate:
    desc: Render the GitOps manifests
    cmds:
      # Route through mise so the task also works when mise is not activated.
      - mise exec -- kustomize build {{.GITOPS_CONFIGS_DIR}}/argocd >/dev/null
      - mise exec -- kustomize build {{.GITOPS_CONFIGS_DIR}}/apps >/dev/null
      - mise exec -- kustomize build {{.GITOPS_KARGO_DIR}} >/dev/null
      - mise exec -- yq --exit-status '.kind == "Application"' {{.GITOPS_CONFIGS_DIR}}/bootstrap/root.yaml >/dev/null

  up:
    desc: Run the whole solution on kind and print URLs and credentials
    preconditions:
      - sh: test -n "${KARGO_GIT_USERNAME:-}" && test -n "${KARGO_GIT_TOKEN:-}"
        msg: Set KARGO_GIT_USERNAME and KARGO_GIT_TOKEN in .env (see .env.example)
      # ArgoCD and Kargo read from GitHub, not from the working tree.
      - sh: git fetch --quiet origin main && git cat-file -e origin/main:{{.GITOPS_KARGO_DIR}}/kustomization.yaml
        msg: "{{.GITOPS_KARGO_DIR}} is not on origin/main yet: commit and push it first"
    cmds:
      - task: cluster:create
      - task: ingress:install
      - task: argocd:install
      - task: kargo:admin
      # Before the bootstrap: the first render can start as soon as the pipeline
      # syncs, and Kargo does not retry an auto-promotion that failed to push.
      - task: kargo:git-credentials
      - task: argocd:bootstrap
      - task: kargo:wait
      - task: up:info

  up:info:
    desc: Print URLs and credentials of ArgoCD, Kargo and the three stages
    silent: true
    cmds:
      - |
        set -eu
        argocd_password="$(kubectl get secret argocd-initial-admin-secret --namespace argocd --output jsonpath='{.data.password}' | base64 --decode)"
        kargo_password="$(kubectl get secret kargo-admin-credentials --namespace {{.KARGO_NAMESPACE}} --output jsonpath='{.data.password}' | base64 --decode)"
        cat <<EOF

        ArgoCD  http://argocd.localhost:{{.LOCAL_HTTP_PORT}}
                user: admin
                password: $argocd_password

        Kargo   http://kargo.localhost:{{.LOCAL_HTTP_PORT}}
                user: admin
                password: $kargo_password

        Stages  http://kargo-pattern-dev.localhost:{{.LOCAL_HTTP_PORT}}
                http://kargo-pattern-staging.localhost:{{.LOCAL_HTTP_PORT}}
                http://kargo-pattern-prod.localhost:{{.LOCAL_HTTP_PORT}}

        EOF

  image:build:
    desc: Build the application container image
    cmds:
      - >-
        docker build
        --build-arg VERSION={{.IMAGE_TAG}}
        --build-arg COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo dev)
        -t {{.IMAGE_REPO}}:{{.IMAGE_TAG}}
        {{.APP_DIR}}

  image:load:
    desc: Load the image into the kind cluster
    cmds:
      - kind load docker-image {{.IMAGE_REPO}}:{{.IMAGE_TAG}} --name {{.CLUSTER_NAME}}

  image:push:
    desc: Push the image to its registry
    cmds:
      - docker push {{.IMAGE_REPO}}:{{.IMAGE_TAG}}

  e2e:
    desc: Create kind, build/load the image and install the chart
    cmds:
      - task: cluster:create
      - task: image:build
      - task: image:load
      - task: ingress:install
      - task: chart:install
      - kubectl rollout status deployment/{{.RELEASE_NAME}} --namespace {{.K8S_NAMESPACE}} --timeout 120s
      - curl --fail --silent --show-error --retry 10 --retry-delay 3 http://{{.INGRESS_HOST}}:{{.LOCAL_HTTP_PORT}}/version

  ci:
    desc: Run all local checks used by GitHub Actions
    cmds:
      - task: app:check
      - task: chart:lint
      - task: chart:template
      - task: gitops:validate
      - mise exec -- actionlint

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist app/bin coverage.out
